async function saveFamily(){

console.log(
"================================="
);


console.log(
"START SAVE FAMILY"
);


console.log(
"APP VERSION:",
APP_VERSION
);


const t =
T[lang];



/* DATABASE CHECK */

if(!db){

alert(
"❌ د معلوماتو د ثبت سیستم له Database سره وصل نه دی."
);

return;

}



/* FAMILY DATA */

const province =
document.getElementById(
"province"
).value.trim();


const district =
document.getElementById(
"district"
).value.trim();


const village =
document.getElementById(
"village"
).value.trim();


const n =
Number(
document.getElementById(
"members"
).value
);



/* FAMILY VALIDATION */

if(

!province ||

!district ||

!village ||

!Number.isInteger(n) ||

n < 1 ||

n > 50

){

alert(

t.error +

"\n\n" +

(

lang === "ps"

?

"مهرباني وکړئ د کورنۍ ټول معلومات بشپړ کړئ."

:

lang === "fa"

?

"لطفاً تمام معلومات خانواده را تکمیل کنید."

:

"Please complete all family information."

)

);

return;

}



/* PEOPLE */

const cards =
document.querySelectorAll(
".person"
);



if(
cards.length !== n
){

alert(

t.error +

"\n\n" +

(

lang === "ps"

?

"د کورنۍ د ټولو غړو معلومات بشپړ کړئ."

:

lang === "fa"

?

"معلومات تمام اعضای خانواده را تکمیل کنید."

:

"Please complete all family members."

)

);

return;

}



let list =
[];



/* LOOP MEMBERS */

for(
let i=0;
i<cards.length;
i++
){

const card =
cards[i];



const name =
card.querySelector(
".pname"
).value.trim();


const father =
card.querySelector(
".father"
).value.trim();


const gender =
card.querySelector(
".gender"
).value;


const ageText =
card.querySelector(
".age"
).value.trim();


const age =
Number(ageText);


const marital =
card.querySelector(
".marital"
).value;


const relation =
card.querySelector(
".relation"
).value.trim();


const education =
card.querySelector(
".education"
).value.trim();


const work =
card.querySelector(
".work"
).value.trim();


const job =
card.querySelector(
".job"
).value.trim();



/* MEMBER VALIDATION */

if(

!name ||

!father ||

ageText === "" ||

!Number.isFinite(age) ||

age < 0 ||

age > 120 ||

!relation

){

alert(

t.error +

"\n\n" +

(

lang === "ps"

?

`د ${i+1}م غړي معلومات نیمګړي دي.`

:

lang === "fa"

?

`معلومات عضو شماره ${i+1} ناقص است.`

:

`Family member ${i+1} is incomplete.`

)

);

return;

}



/* ADD MEMBER */

list.push({

name:name,

father_name:father,

gender:gender,

age:age,

marital_status:marital,

relation:relation,

education:education,

work_status:work,

occupation:job

});

}



/* GENDER COUNT */

const male =
list.filter(
p => p.gender === "male"
).length;


const female =
list.filter(
p => p.gender === "female"
).length;



/* HOUSEHOLD DATA */

const householdData = {

province:province,

district:district,

village:village,

members:n,

male:male,

female:female,

people:list

};



console.log(
"DATA TO SUPABASE:",
householdData
);



/* BUTTON */

const submit =
document.getElementById(
"submitBtn"
);


submit.disabled =
true;


submit.textContent =
t.saving;



/* ==========================================
   INSERT INTO SUPABASE
========================================== */

try{


console.log(
"Sending data to Supabase..."
);



/*
IMPORTANT:
insert([householdData])
is used here.
*/

const result =
await db
.from("households")
.insert([
householdData
]);



console.log(
"Supabase response:",
result
);



/* DATABASE ERROR */

if(
result.error
){

console.error(
"SUPABASE INSERT ERROR:",
result.error
);


alert(

t.error +

"\n\n" +

result.error.message

);


submit.disabled =
false;


submit.textContent =
t.save;


return;

}



/* SUCCESS */

console.log(
"================================="
);


console.log(
"SUCCESS: DATA INSERTED"
);


console.log(
"================================="
);



alert(
t.success
);



/* CLEAR FORM */

document.getElementById(
"village"
).value =
"";


document.getElementById(
"members"
).value =
"";


document.getElementById(
"people"
).innerHTML =
"";



/* RESET BUTTON */

submit.disabled =
false;


submit.textContent =
t.save;



}catch(error){


console.error(
"JAVASCRIPT ERROR:",
error
);


alert(

t.error +

"\n\n" +

error.message

);


submit.disabled =
false;


submit.textContent =
t.save;

}

}
