/* ==========================================
SAVE FAMILY
DIRECT SUPABASE REST API
========================================== */

async function saveFamily(){

const t = T[lang];

const submit =
document.getElementById("submitBtn");


/* FAMILY */

const province =
document.getElementById("province").value.trim();

const district =
document.getElementById("district").value.trim();

const village =
document.getElementById("village").value.trim();

const n =
Number(
document.getElementById("members").value
);


/* VALIDATE FAMILY */

if(
!province ||
!district ||
!village ||
!Number.isInteger(n) ||
n < 1 ||
n > 50
){

showStatus(

lang === "ps"
?
"❌ مهرباني وکړئ د کورنۍ ټول معلومات په سمه توګه بشپړ کړئ."

:
lang === "fa"
?
"❌ لطفاً تمام معلومات خانواده را تکمیل کنید."

:
"❌ Please complete all family information.",

"error"

);

return;

}


/* PEOPLE */

const cards =
document.querySelectorAll(".person");


if(cards.length !== n){

showStatus(
"❌ د کورنۍ د غړو فورم بشپړ نه دی.",
"error"
);

return;

}


let people = [];


for(
let i=0;
i<cards.length;
i++
){

const card = cards[i];

const name =
card.querySelector(".pname")
.value.trim();

const father =
card.querySelector(".father")
.value.trim();

const gender =
card.querySelector(".gender")
.value;

const ageText =
card.querySelector(".age")
.value.trim();

const age =
Number(ageText);

const marital =
card.querySelector(".marital")
.value;

const relation =
card.querySelector(".relation")
.value.trim();

const education =
card.querySelector(".education")
.value.trim();

const work =
card.querySelector(".work")
.value.trim();

const job =
card.querySelector(".job")
.value.trim();


if(
!name ||
!father ||
ageText === "" ||
!Number.isFinite(age) ||
age < 0 ||
age > 120 ||
!relation
){

showStatus(

lang === "ps"
?
`❌ د ${i+1}م غړي معلومات بشپړ کړئ.`

:
lang === "fa"
?
`❌ معلومات عضو شماره ${i+1} را تکمیل کنید.`

:
`❌ Complete information for member ${i+1}.`,

"error"

);

return;

}


people.push({

name:name,

father_name:father,

gender:gender,

age:age,

marital_status:marital,

relation:relation,

education:education,

work_status:work,

occupation:job

});

}


/* GENDER */

const male =
people.filter(
p => p.gender === "male"
).length;

const female =
people.filter(
p => p.gender === "female"
).length;


/* DATA */

const householdData = {

province:province,

district:district,

village:village,

members:n,

male:male,

female:female,

people:people

};


/* BUTTON */

submit.disabled = true;

submit.textContent = t.saving;

showStatus(
t.saving,
"info"
);


try{

console.log(
"Sending directly to Supabase..."
);


/* ABORT CONTROLLER */

const controller =
new AbortController();


const timer =
setTimeout(
function(){

controller.abort();

},
15000
);


/* SUPABASE REST REQUEST */

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/households",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:
JSON.stringify(
householdData
),

signal:
controller.signal

}

);


/* CLEAR TIMER */

clearTimeout(timer);


/* HTTP STATUS */

console.log(
"Supabase HTTP status:",
response.status
);


/* RESPONSE TEXT */

let resultText = "";

try{

resultText =
await response.text();

}catch(e){

resultText = "";

}


/* ERROR */

if(!response.ok){

console.error(
"SUPABASE REST ERROR:",
response.status,
resultText
);


let message =
"Supabase Error: " +
response.status;


try{

const errorData =
JSON.parse(resultText);


if(errorData.message){

message =
errorData.message;

}


if(errorData.error){

message =
errorData.error;

}


if(errorData.hint){

message +=
"<br><small>" +
errorData.hint +
"</small>";

}

}catch(e){}


showStatus(

"❌ " +
message,

"error"

);


submit.disabled = false;

submit.textContent =
t.save;

return;

}


/* SUCCESS */

console.log(
"Family successfully inserted."
);


showStatus(
t.success,
"success"
);


/* CLEAR FORM */

document.getElementById(
"village"
).value = "";

document.getElementById(
"members"
).value = "";

document.getElementById(
"people"
).innerHTML = "";


/* BUTTON */

submit.disabled = false;

submit.textContent =
t.save;


}catch(error){

console.error(
"SAVE ERROR:",
error
);


let message =
error.message ||
String(error);


if(
error.name === "AbortError"
){

message =
"Supabase ته د اتصال وخت پای ته ورسېد. مهرباني وکړئ Internet اتصال وګورئ.";

}


showStatus(

"❌ " +
message,

"error"

);


submit.disabled = false;

submit.textContent =
t.save;

}

}
