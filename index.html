<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>د افغانستان د نفوس آنلاین شمېرنه</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #075e54;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      font-size: 16px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin: 0 0 10px;
      color: #075e54;
    }

    .card p {
      font-size: 25px;
      font-weight: bold;
      margin: 0;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .form-box h2 {
      color: #075e54;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #064c44;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #222;
      color: white;
    }

    .notice {
      background: #fff3cd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>🇦🇫 د افغانستان د نفوس آنلاین شمېرنه</h1>
  <p>د کورنیو او نفوس د معلوماتو د ثبت او احصائیې سیستم</p>
</header>

<div class="container">

  <div class="notice">
    <strong>یادونه:</strong>
    دا یوه آنلاین سروې ده. ثبت شوي معلومات د افغانستان د رسمي نفوس د شمېرنې بدیل نه دي.
  </div>

  <div class="stats">

    <div class="card">
      <h2>ټولې کورنۍ</h2>
      <p id="households">0</p>
    </div>

    <div class="card">
      <h2>ټول نفوس</h2>
      <p id="population">0</p>
    </div>

    <div class="card">
      <h2>نارینه</h2>
      <p id="male">0</p>
    </div>

    <div class="card">
      <h2>ښځینه</h2>
      <p id="female">0</p>
    </div>

  </div>

  <div class="form-box">

    <h2>📝 خپله کورنۍ ثبت کړئ</h2>

    <form id="censusForm">

      <label>ولایت</label>

      <select id="province" required>
        <option value="">ولایت انتخاب کړئ</option>
        <option>کابل</option>
        <option>ننګرهار</option>
        <option>پکتیا</option>
        <option>کندهار</option>
        <option>هرات</option>
        <option>بلخ</option>
        <option>پروان</option>
        <option>لغمان</option>
        <option>کنړ</option>
        <option>خوست</option>
        <option>لوګر</option>
        <option>وردګ</option>
        <option>غزني</option>
        <option>بامیان</option>
        <option>بدخشان</option>
        <option>تخار</option>
        <option>کندز</option>
        <option>فاریاب</option>
        <option>جوزجان</option>
        <option>سرپل</option>
        <option>سمنګان</option>
        <option>دایکندي</option>
        <option>ارزګان</option>
        <option>زابل</option>
        <option>پکتیکا</option>
        <option>فراه</option>
        <option>نیمروز</option>
        <option>هلمند</option>
        <option>بادغیس</option>
        <option>غور</option>
        <option>کاپیسا</option>
        <option>پنجشېر</option>
        <option>نورستان</option>
      </select>

      <label>د کورنۍ د غړو شمېر</label>

      <input
        type="number"
        id="members"
        min="1"
        max="100"
        placeholder="مثلاً 7"
        required
      >

      <label>د نارینه وو شمېر</label>

      <input
        type="number"
        id="maleInput"
        min="0"
        placeholder="مثلاً 4"
        required
      >

      <label>د ښځینه وو شمېر</label>

      <input
        type="number"
        id="femaleInput"
        min="0"
        placeholder="مثلاً 3"
        required
      >

      <button type="submit">
        ✅ معلومات ثبت کړئ
      </button>

    </form>

  </div>

</div>

<footer>
  Afghanistan Population Census © 2026
</footer>

<script>

  let households = 0;
  let population = 0;
  let male = 0;
  let female = 0;

  document.getElementById("censusForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const members = Number(document.getElementById("members").value);
    const maleCount = Number(document.getElementById("maleInput").value);
    const femaleCount = Number(document.getElementById("femaleInput").value);

    if (maleCount + femaleCount !== members) {
      alert("د نارینه او ښځینه شمېر باید د ټولې کورنۍ له شمېر سره برابر وي.");
      return;
    }

    households++;
    population += members;
    male += maleCount;
    female += femaleCount;

    document.getElementById("households").textContent = households;
    document.getElementById("population").textContent = population;
    document.getElementById("male").textContent = male;
    document.getElementById("female").textContent = female;

    alert("ستاسې معلومات په دې Demo نسخه کې ثبت شول.");

    document.getElementById("censusForm").reset();

  });

</script>

</body>
  </html>
