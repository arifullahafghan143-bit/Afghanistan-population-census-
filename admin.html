<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>د نفوس Admin سیستم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f4f6f8;
color:#222;
}

.container{
max-width:1100px;
margin:30px auto;
padding:15px;
}

.card{
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

input,select,button{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#1261a0;
color:white;
border:none;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.logout{
background:#c62828;
}

.hidden{
display:none !important;
}

.error{
color:#c62828;
margin-bottom:15px;
}

.success{
color:green;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.stat{
background:#eef5ff;
padding:18px;
border-radius:10px;
text-align:center;
}

.stat strong{
display:block;
font-size:28px;
margin-top:8px;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:right;
white-space:nowrap;
}

th{
background:#f0f2f5;
}

#status{
font-weight:bold;
}

@media(max-width:700px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.container{
margin:10px auto;
}

}

</style>

</head>

<body>

<div class="container">

<h1>د نفوس Admin سیستم</h1>

<div id="status">
سیستم چک کېږي...
</div>


<!-- LOGIN -->

<div id="loginBox" class="card hidden">

<h2>Admin Login</h2>

<div id="loginError" class="error"></div>

<label>
ایمیل
</label>

<input
id="email"
type="email"
placeholder="Email">

<label>
پاسورډ
</label>

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>


<!-- ADMIN -->

<div id="adminBox" class="hidden">

<div class="card">

<h2>د نفوس معلومات</h2>

<button
class="logout"
onclick="logout()">
وتل
</button>

</div>


<div class="card">

<div class="stats">

<div class="stat">
ټولې کورنۍ
<strong id="totalHouseholds">0</strong>
</div>

<div class="stat">
ټول نفوس
<strong id="totalPopulation">0</strong>
</div>

<div class="stat">
نارینه
<strong id="totalMale">0</strong>
</div>

<div class="stat">
ښځینه
<strong id="totalFemale">0</strong>
</div>

</div>

</div>


<div class="card">

<h2>ثبت شوې کورنۍ</h2>

<div id="dataStatus"></div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>ID</th>
<th>ولایت</th>
<th>ولسوالي</th>
<th>سیمه</th>
<th>غړي</th>
<th>نارینه</th>
<th>ښځینه</th>
<th>نېټه</th>

</tr>

</thead>

<tbody id="dataTable">

</tbody>

</table>

</div>

</div>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://lswxkfkqpkzncbpiqqyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable__YQz3wIbmc7qXYxJvL9fcw_CpmHhDxT";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* START */

async function start(){

document.getElementById("status").textContent =
"سیستم چک کېږي...";

try{

const {
data:{
session
}
} = await db.auth.getSession();


if(session){

showAdmin();

}else{

showLogin();

}

}catch(error){

console.error(error);

document.getElementById("status").textContent =
"د سیستم په چک کولو کې ستونزه راغله.";

showLogin();

}

}


/* LOGIN FORM */

function showLogin(){

document.getElementById("status").classList.add("hidden");

document.getElementById("adminBox").classList.add("hidden");

document.getElementById("loginBox").classList.remove("hidden");

}


/* ADMIN */

async function showAdmin(){

document.getElementById("status").classList.add("hidden");

document.getElementById("loginBox").classList.add("hidden");

document.getElementById("adminBox").classList.remove("hidden");

await loadData();

}


/* LOGIN */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const errorBox =
document.getElementById("loginError");

errorBox.textContent = "";

if(!email || !password){

errorBox.textContent =
"ایمیل او پاسورډ ولیکئ.";

return;

}

const {
data,
error
} =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(error){

console.error(error);

errorBox.textContent =
"Login ناکام شو: " + error.message;

return;

}

showAdmin();

}


/* LOGOUT */

async function logout(){

await db.auth.signOut();

location.reload();

}


/* LOAD DATA */

async function loadData(){

const status =
document.getElementById("dataStatus");

status.textContent =
"معلومات راوړل کېږي...";

try{

const {
data,
error
} =
await db.rpc(
"admin_get_households"
);

if(error){

console.error(error);

status.textContent =
"معلومات ونه لوستل شول: " +
error.message;

return;

}

const rows =
Array.isArray(data)
? data
: [];

renderStats(rows);

renderTable(rows);

status.textContent =
"معلومات په بریالیتوب سره راوړل شول.";

}catch(error){

console.error(error);

status.textContent =
"تخنیکي ستونزه رامنځته شوه.";

}

}


/* STATS */

function renderStats(rows){

let households = rows.length;

let population = 0;

let male = 0;

let female = 0;


rows.forEach(row=>{

population +=
Number(row.members || 0);

male +=
Number(row.male || 0);

female +=
Number(row.female || 0);

});


document.getElementById(
"totalHouseholds"
).textContent =
households;


document.getElementById(
"totalPopulation"
).textContent =
population;


document.getElementById(
"totalMale"
).textContent =
male;


document.getElementById(
"totalFemale"
).textContent =
female;

}


/* ESCAPE */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* TABLE */

function renderTable(rows){

const table =
document.getElementById("dataTable");

table.innerHTML = "";


if(!rows.length){

table.innerHTML = `
<tr>
<td colspan="8"
style="text-align:center">
تر اوسه هېڅ کورنۍ ثبت شوې نه ده.
</td>
</tr>
`;

return;

}


rows.forEach(row=>{

const tr =
document.createElement("tr");


tr.innerHTML = `

<td>${escapeHTML(row.id)}</td>

<td>${escapeHTML(row.province)}</td>

<td>${escapeHTML(row.district)}</td>

<td>${escapeHTML(row.village)}</td>

<td>${escapeHTML(row.members)}</td>

<td>${escapeHTML(row.male)}</td>

<td>${escapeHTML(row.female)}</td>

<td>
${row.created_at
? new Date(row.created_at).toLocaleString()
: ""}
</td>

`;


table.appendChild(tr);

});

}


/* SESSION */

db.auth.onAuthStateChange(
(event,session)=>{

if(session){

showAdmin();

}

});


/* START SYSTEM */

if(
document.readyState === "loading"
){

document.addEventListener(
"DOMContentLoaded",
start
);

}else{

start();

}

</script>

</body>

</html>
