<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

<style>

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f1f5f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.box{
background:white;
width:90%;
max-width:420px;
padding:30px;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,.12);
}

h1{
text-align:center;
color:#0f766e;
}

input{
width:100%;
padding:13px;
margin:8px 0 15px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:13px;
background:#0f766e;
color:white;
border:0;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

#message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>د نفوس Admin سیستم</h1>

<label>ایمیل</label>

<input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="username">


<label>پاسورډ</label>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password">


<button id="loginButton">

Login

</button>


<div id="message"></div>

</div>


<script>

const SUPABASE_URL =
"https://lswxkfkqpkzncbpiqqyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable__YQz3wIbmc7qXYxJvL9fcw_CpmHhDxT";


const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


document
.getElementById("loginButton")
.addEventListener(
"click",
async function(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const message =
document
.getElementById("message");


message.textContent =
"Login کېږي...";


if(!email || !password){

message.textContent =
"ایمیل او پاسورډ ولیکئ.";

return;

}


try{

const result =
await client.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

console.error(result.error);

message.textContent =
"Login ناکام شو: " +
result.error.message;

return;

}


message.textContent =
"Login بریالی شو.";


window.location.href =
"dashboard.html";


}catch(error){

console.error(error);

message.textContent =
"تخنیکي ستونزه: " +
error.message;

}

});

</script>

</body>

</html>
