<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د نفوس Admin سیستم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="districts.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

header{
  background:#123c69;
  color:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
}

header h1{
  margin:0 0 8px;
  font-size:25px;
}

header p{
  margin:0;
  opacity:.9;
}

.status{
  padding:12px;
  border-radius:10px;
  margin:15px 0;
  background:#fff3cd;
  color:#664d03;
}

.status.ok{
  background:#d1e7dd;
  color:#0f5132;
}

.status.bad{
  background:#f8d7da;
  color:#842029;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd4df;
  border-radius:8px;
  font-size:15px;
  margin-top:6px;
  background:white;
}

label{
  font-weight:bold;
  display:block;
  margin-bottom:14px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.btn-primary{
  background:#123c69;
  color:white;
}

.btn-success{
  background:#198754;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-secondary{
  background:#6c757d;
  color:white;
}

.btn-light{
  background:#e9ecef;
  color:#222;
}

.login{
  max-width:450px;
  margin:40px auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat{
  background:#fff;
  border-radius:12px;
  padding:20px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.stat strong{
  display:block;
  font-size:30px;
  margin-top:8px;
  color:#123c69;
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  border-bottom:1px solid #e1e5ea;
  padding:12px 8px;
  text-align:right;
  vertical-align:top;
}

th{
  background:#eef3f8;
}

.member{
  background:#f7f9fc;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

.member:last-child{
  margin-bottom:0;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.hidden{
  display:none !important;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  z-index:1000;
}

.modal-box{
  background:white;
  width:100%;
  max-width:850px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:15px;
  padding:20px;
}

.member-edit{
  border:1px solid #dce2e8;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.footer-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .container{
    padding:10px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .stat{
    padding:14px 8px;
  }

  .stat strong{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>د نفوس Admin سیستم</h1>
  <p>یوازې د مجاز Admin لپاره</p>
</header>

<div id="connectionStatus" class="status">
  سیستم چک کېږي...
</div>

<!-- LOGIN -->
<div id="loginBox" class="card login hidden">

  <h2>Admin Login</h2>

  <label>
    Email
    <input id="email" type="email" placeholder="Email">
  </label>

  <label>
    Password
    <input id="password" type="password" placeholder="Password">
  </label>

  <button class="btn-primary" onclick="login()">
    Login
  </button>

  <div id="loginMessage" class="status hidden"></div>

</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

  <div class="card">
    <div class="actions">

      <button class="btn-primary" onclick="loadData()">
        🔄 معلومات تازه کول
      </button>

      <button class="btn-secondary" onclick="logout()">
        🚪 وتل
      </button>

    </div>
  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      ټولې کورنۍ
      <strong id="totalHouseholds">0</strong>
    </div>

    <div class="stat">
      ټول نفوس
      <strong id="totalPopulation">0</strong>
    </div>

    <div class="stat">
      نارینه
      <strong id="totalMale">0</strong>
    </div>

    <div class="stat">
      ښځینه
      <strong id="totalFemale">0</strong>
    </div>

  </div>

  <!-- FILTERS -->
  <div class="card">

    <h2>🔎 د معلوماتو لټون او Filter</h2>

    <div class="filters">

      <label>
        ولایت
        <select id="provinceFilter" onchange="provinceChanged()">
          <option value="">ټول ولایتونه</option>
        </select>
      </label>

      <label>
        ولسوالۍ
        <select id="districtFilter" onchange="applyFilters()">
          <option value="">ټولې ولسوالۍ</option>
        </select>
      </label>

      <label>
        د شخص نوم
        <input
          id="nameSearch"
          type="text"
          placeholder="د شخص یا پلار نوم ولیکئ..."
          oninput="applyFilters()"
        >
      </label>

    </div>

  </div>

  <!-- TABLE -->
  <div class="card">

    <h2>📋 د ثبت شوو کورنیو تاریخ</h2>

    <div id="dataMessage" class="status hidden"></div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>نېټه</th>
            <th>ولایت</th>
            <th>ولسوالي</th>
            <th>سیمه / کلی</th>
            <th>کورنۍ</th>
            <th>نارینه</th>
            <th>ښځینه</th>
            <th>د کورنۍ غړي</th>
            <th>عملیات</th>
          </tr>

        </thead>

        <tbody id="dataBody"></tbody>

      </table>

    </div>

  </div>

</div>

</div>


<!-- EDIT MODAL -->
<div id="editModal" class="modal hidden">

  <div class="modal-box">

    <h2>✏️ د کورنۍ معلومات بدلول</h2>

    <div class="grid">

      <label>
        ولایت
        <select id="editProvince"></select>
      </label>

      <label>
        ولسوالۍ
        <select id="editDistrict"></select>
      </label>

      <label>
        سیمه / کلی
        <input id="editVillage" type="text">
      </label>

    </div>

    <h3>د کورنۍ غړي</h3>

    <div id="editMembers"></div>

    <div class="footer-actions">

      <button class="btn-success" onclick="saveEdit()">
        💾 معلومات ثبتول
      </button>

      <button class="btn-light" onclick="closeEdit()">
        لغوه
      </button>

    </div>

    <div id="editMessage" class="status hidden"></div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://lswxkfkqpkzncbpiqqyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable__YQz3wIbmc7qXYxJvL9fcw_CpmHhDxT";

let supabaseClient = null;

let allRows = [];

let filteredRows = [];

let editingId = null;


/* =========================
   PROVINCES
========================= */

const provinceNames = {

  "Badakhshan":"بدخشان",
  "Badghis":"بادغیس",
  "Baghlan":"بغلان",
  "Balkh":"بلخ",
  "Bamyan":"بامیان",
  "Daykundi":"دایکندي",
  "Farah":"فراه",
  "Faryab":"فاریاب",
  "Ghazni":"غزني",
  "Ghor":"غور",
  "Helmand":"هلمند",
  "Herat":"هرات",
  "Jowzjan":"جوزجان",
  "Kabul":"کابل",
  "Kandahar":"کندهار",
  "Kapisa":"کاپیسا",
  "Khost":"خوست",
  "Kunar":"کونړ",
  "Kunduz":"کندز",
  "Laghman":"لغمان",
  "Logar":"لوګر",
  "Nangarhar":"ننګرهار",
  "Nimroz":"نیمروز",
  "Nuristan":"نورستان",
  "Paktia":"پکتیا",
  "Paktika":"پکتیکا",
  "Panjshir":"پنجشیر",
  "Parwan":"پروان",
  "Samangan":"سمنګان",
  "Sar-e Pol":"سرپل",
  "Takhar":"تخار",
  "Uruzgan":"اروزګان",
  "Wardak":"وردګ",
  "Zabul":"زابل"

};

const provinceKeys = Object.keys(provinceNames);


/* =========================
   SAFE START
========================= */

function startAdmin(){

  const status =
    document.getElementById("connectionStatus");

  try{

    if(
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ){

      status.textContent =
      "❌ Supabase سیستم لوډ نه شو.";

      status.className =
      "status bad";

      showLogin();

      return;

    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    status.textContent =
    "✅ Supabase سیستم تیار دی.";

    status.className =
    "status ok";

    fillProvinceFilters();

    showLogin();

    checkSession();

  }catch(error){

    console.error(error);

    status.textContent =
    "❌ د سیستم د پیل ستونزه: " +
    (error.message || error);

    status.className =
    "status bad";

    showLogin();

  }

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document
  .getElementById("loginBox")
  .classList
  .remove("hidden");

}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){

    message.textContent =
    "Email او Password ولیکئ.";

    message.className =
    "status bad";

    return;

  }

  message.textContent =
  "Login کېږي...";

  message.className =
  "status";

  try{

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });

    if(error) throw error;

    message.textContent =
    "✅ Login بریالی شو.";

    message.className =
    "status ok";

    setTimeout(function(){

      document
      .getElementById("loginBox")
      .classList
      .add("hidden");

      document
      .getElementById("adminPanel")
      .classList
      .remove("hidden");

      loadData();

    },500);

  }catch(error){

    console.error(error);

    message.textContent =
    "❌ Login ستونزه: " +
    (error.message || error);

    message.className =
    "status bad";

  }

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

  if(!supabaseClient) return;

  try{

    const {data} =
      await supabaseClient.auth.getSession();

    if(
      data &&
      data.session
    ){

      document
      .getElementById("loginBox")
      .classList
      .add("hidden");

      document
      .getElementById("adminPanel")
      .classList
      .remove("hidden");

      loadData();

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  if(!supabaseClient) return;

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================
   PROVINCE FILTER
========================= */

function fillProvinceFilters(){

  const filter =
    document.getElementById("provinceFilter");

  const edit =
    document.getElementById("editProvince");

  if(!filter) return;

  filter.innerHTML =
  '<option value="">ټول ولایتونه</option>';

  if(edit){

    edit.innerHTML =
    '<option value="">ولایت انتخاب کړئ</option>';

  }

  provinceKeys.forEach(function(key){

    const option =
      document.createElement("option");

    option.value = key;

    option.textContent =
      provinceNames[key] || key;

    filter.appendChild(option);

    if(edit){

      const editOption =
        document.createElement("option");

      editOption.value = key;

      editOption.textContent =
        provinceNames[key] || key;

      edit.appendChild(editOption);

    }

  });

}


/* =========================
   DISTRICTS
========================= */

function getDistrictList(province){

  try{

    if(
      typeof districts !== "undefined" &&
      districts
    ){

      if(Array.isArray(districts)){

        return districts
        .filter(function(item){

          return (
            item.province === province ||
            item.Province === province
          );

        })
        .map(function(item){

          return (
            item.district ||
            item.District ||
            item.name ||
            item.Name
          );

        })
        .filter(Boolean);

      }

      if(
        typeof districts === "object" &&
        Array.isArray(districts[province])
      ){

        return districts[province];

      }

    }

  }catch(error){

    console.warn(
      "districts.js error:",
      error
    );

  }

  return [];

}


/* =========================
   PROVINCE CHANGED
========================= */

function provinceChanged(){

  const province =
    document.getElementById(
      "provinceFilter"
    ).value;

  const district =
    document.getElementById(
      "districtFilter"
    );

  district.innerHTML =
  '<option value="">ټولې ولسوالۍ</option>';

  if(province){

    const list =
      getDistrictList(province);

    list.forEach(function(name){

      const option =
        document.createElement("option");

      option.value = name;

      option.textContent = name;

      district.appendChild(option);

    });

  }

  applyFilters();

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

  if(!supabaseClient) return;

  const message =
    document.getElementById("dataMessage");

  message.classList.remove("hidden");

  message.textContent =
    "معلومات لوډ کېږي...";

  message.className =
    "status";

  try{

    const {data,error} =
      await supabaseClient.rpc(
        "admin_get_households"
      );

    if(error) throw error;

    allRows =
      Array.isArray(data)
      ? data
      : [];

    applyFilters();

    message.classList.add("hidden");

  }catch(error){

    console.error(error);

    message.textContent =
    "❌ معلومات ونه لوډ شول: " +
    (error.message || error);

    message.className =
    "status bad";

  }

}


/* =========================
   FILTER
========================= */

function applyFilters(){

  const province =
    document
    .getElementById("provinceFilter")
    .value
    .toLowerCase();

  const district =
    document
    .getElementById("districtFilter")
    .value
    .toLowerCase();

  const search =
    document
    .getElementById("nameSearch")
    .value
    .trim()
    .toLowerCase();

  filteredRows =
    allRows.filter(function(row){

      if(
        province &&
        String(row.province || "")
        .toLowerCase() !== province
      ){

        return false;

      }

      if(
        district &&
        String(row.district || "")
        .toLowerCase() !== district
      ){

        return false;

      }

      if(search){

        const people =
          Array.isArray(row.people)
          ? row.people
          : [];

        const found =
          people.some(function(person){

            const name =
              String(
                person.name || ""
              ).toLowerCase();

            const father =
              String(
                person.father_name || ""
              ).toLowerCase();

            return (
              name.includes(search) ||
              father.includes(search)
            );

          });

        if(!found) return false;

      }

      return true;

    });

  renderStats();

  renderTable();

}


/* =========================
   STATS
========================= */

function renderStats(){

  let households =
    filteredRows.length;

  let population = 0;

  let male = 0;

  let female = 0;

  filteredRows.forEach(function(row){

    population +=
      Number(row.members || 0);

    male +=
      Number(row.male || 0);

    female +=
      Number(row.female || 0);

  });

  document
  .getElementById("totalHouseholds")
  .textContent = households;

  document
  .getElementById("totalPopulation")
  .textContent = population;

  document
  .getElementById("totalMale")
  .textContent = male;

  document
  .getElementById("totalFemale")
  .textContent = female;

}


/* =========================
   MEMBER DETAILS
========================= */

function memberHTML(person){

  const relation =
    person.relation ||
    person.relationship ||
    "";

  const work =
    person.work_status ||
    person.employment ||
    "";

  return `
    <div class="member">

      <b>نوم:</b>
      ${escapeHTML(person.name || "")}
      <br>

      <b>د پلار نوم:</b>
      ${escapeHTML(person.father_name || "")}
      <br>

      <b>جنس:</b>
      ${escapeHTML(person.gender || "")}
      <br>

      <b>عمر:</b>
      ${escapeHTML(String(person.age || ""))}
      <br>

      <b>مدني حالت:</b>
      ${escapeHTML(person.marital_status || "")}
      <br>

      <b>د کورنۍ اړیکه:</b>
      ${escapeHTML(relation)}
      <br>

      <b>زده کړه:</b>
      ${escapeHTML(person.education || "")}
      <br>

      <b>د کار حالت:</b>
      ${escapeHTML(work)}
      <br>

      <b>دنده:</b>
      ${escapeHTML(person.occupation || "")}

    </div>
  `;

}


/* =========================
   TABLE
========================= */

function renderTable(){

  const body =
    document.getElementById("dataBody");

  body.innerHTML = "";

  if(filteredRows.length === 0){

    body.innerHTML = `
      <tr>
        <td colspan="9">
          تر اوسه هېڅ معلومات ونه موندل شول.
        </td>
      </tr>
    `;

    return;

  }

  filteredRows.forEach(function(row){

    const tr =
      document.createElement("tr");

    const people =
      Array.isArray(row.people)
      ? row.people
      : [];

    const membersHTML =
      people
      .map(memberHTML)
      .join("");

    const date =
      row.created_at
      ? new Date(row.created_at)
        .toLocaleString("ps-AF")
      : "";

    tr.innerHTML = `

      <td>
        ${escapeHTML(date)}
      </td>

      <td>
        ${escapeHTML(
          provinceNames[row.province] ||
          row.province ||
          ""
        )}
      </td>

      <td>
        ${escapeHTML(row.district || "")}
      </td>

      <td>
        ${escapeHTML(row.village || "")}
      </td>

      <td>
        ${Number(row.members || 0)}
      </td>

      <td>
        ${Number(row.male || 0)}
      </td>

      <td>
        ${Number(row.female || 0)}
      </td>

      <td>
        ${membersHTML}
      </td>

      <td>

        <div class="actions">

          <button
            class="btn-primary"
            onclick="openEdit('${String(row.id)}')"
          >
            ✏️ Edit
          </button>

          <button
            class="btn-danger"
            onclick="deleteRow('${String(row.id)}')"
          >
            🗑️ Delete
          </button>

        </div>

      </td>

    `;

    body.appendChild(tr);

  });

}


/* =========================
   EDIT
========================= */

function openEdit(id){

  const row =
    allRows.find(function(item){

      return String(item.id) === String(id);

    });

  if(!row) return;

  editingId = id;

  document
  .getElementById("editProvince")
  .value =
    row.province || "";

  fillEditDistricts(
    row.province || "",
    row.district || ""
  );

  document
  .getElementById("editVillage")
  .value =
    row.village || "";

  const box =
    document.getElementById(
      "editMembers"
    );

  box.innerHTML = "";

  const people =
    Array.isArray(row.people)
    ? row.people
    : [];

  people.forEach(function(person,index){

    const relation =
      person.relation ||
      person.relationship ||
      "";

    const work =
      person.work_status ||
      person.employment ||
      "";

    box.innerHTML += `

      <div class="member-edit">
