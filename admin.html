<script>


/* ======================================

const SUPABASE_URL =
"https://lswxkfkqpkzncbpiqqyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable__YQz3wIbmc7qXYxJvL9fcw_CpmHhDxT";

let supabaseClient = null;

let allRows = [];

let editingId = null;



/* ======================================
   PROVINCES
====================================== */

const provinceKeys = [

"Nuristan",
"Baghlan"

];


const provinceNames = [

"کابل",
"ننګرهار",
"پکتیا",
"کندهار",
"هرات",

"کندز",
"تخار",

"بامیان",
"دایکندي",
"ارزګان",
"میدان وردګ",

"کاپیسا",
"پنجشېر",
"نورستان",
"بغلان"

];



/* ======================================
   SUPABASE CHECK
====================================== */

function checkSupabase(){

const status =
document.getElementById(
"connectionStatus"
);

if(
typeof window.supabase === "undefined"
){

status.textContent =
"❌ Supabase سیستم لوډ نه شو.";

status.className =
"status bad";

return false;

}


try{

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

status.textContent =
"✅ Supabase سیستم تیار دی.";

status.className =
"status ok";

return true;

}catch(error){

console.error(error);

status.textContent =
"❌ Supabase جوړ نه شو.";

status.className =
"status bad";

return false;

}

}



/* ======================================
   MESSAGE
====================================== */

function showMessage(
text,
type="error"
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

box.style.display =
"block";

}



/* ======================================
   LOAD PROVINCES FILTER
====================================== */

function loadProvinceFilter(){

const box =
document.getElementById(
"provinceFilter"
);

box.innerHTML =
'<option value="">ټول ولایتونه</option>';

provinceKeys.forEach(
(key,index)=>{

const option =
document.createElement(
"option"
);

option.value =
key;

option.textContent =
provinceNames[index];

box.appendChild(option);

});

}



/* ======================================
   LOAD DISTRICT FILTER
====================================== */

function loadDistrictFilter(){

const province =
document.getElementById(
"provinceFilter"
).value;

const box =
document.getElementById(
"districtFilter"
);

box.innerHTML =
'<option value="">ټولې ولسوالۍ</option>';

if(
!province ||
typeof districts === "undefined" ||
!districts ||
!districts[province]
){

return;

}

districts[province].forEach(
district=>{

const option =
document.createElement(
"option"
);

option.value =
district;

option.textContent =
district;

box.appendChild(option);

});

}



/* ======================================
   LOGIN
====================================== */

async function login(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;

const button =
document.getElementById(
"loginButton"
);


if(!email){

showMessage(
"مهرباني وکړئ Email ولیکئ.",
"error"
);

return;

}


if(!password){

showMessage(
"مهرباني وکړئ Password ولیکئ.",
"error"
);

return;

}


if(!supabaseClient){

if(!checkSupabase()){

showMessage(
"Supabase سیستم تیار نه دی.",
"error"
);

return;

}

}


button.disabled =
true;

button.textContent =
"ننوتل کېږي...";


try{

const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

console.error(
"LOGIN ERROR:",
error
);

showMessage(
"❌ ننوتل ناکام شول: " +
error.message,
"error"
);

button.disabled =
false;

button.textContent =
"ننوتل";

return;

}


if(
!data ||
!data.user
){

showMessage(
"❌ User ونه موندل شو.",
"error"
);

button.disabled =
false;

button.textContent =
"ننوتل";

return;

}


document.getElementById(
"loginPanel"
).style.display =
"none";

document.getElementById(
"adminPanel"
).style.display =
"block";


loadProvinceFilter();

await loadData();


}catch(error){

console.error(error);

showMessage(
"❌ یوه تېروتنه رامنځته شوه: " +
error.message,
"error"
);

}


button.disabled =
false;

button.textContent =
"ننوتل";

}



/* ======================================
   LOAD DATA
====================================== */

async function loadData(){

const container =
document.getElementById(
"tableContainer"
);

container.innerHTML =
'<div class="loading">معلومات لوډ کېږي...</div>';


try{

const {data,error} =
await supabaseClient.rpc(
"admin_get_households"
);


if(error){

console.error(
"RPC ERROR:",
error
);

container.innerHTML =
'<div class="empty">❌ معلومات ترلاسه نه شول.<br>' +
escapeHtml(error.message) +
'</div>';

return;

}


let rows =
data || [];


if(typeof rows === "string"){

try{

rows =
JSON.parse(rows);

}catch(e){

rows =
[];

}

}


if(!Array.isArray(rows)){

rows =
[];

}


allRows =
rows;


applyFilters();


}catch(error){

console.error(error);

container.innerHTML =
'<div class="empty">❌ تېروتنه: ' +
escapeHtml(error.message) +
'</div>';

}

}



/* ======================================
   FILTER
====================================== */

function applyFilters(){

const province =
document.getElementById(
"provinceFilter"
).value.trim();

const district =
document.getElementById(
"districtFilter"
).value.trim();

const search =
document.getElementById(
"nameSearch"
).value.trim().toLowerCase();


let rows =
allRows.filter(
row=>{

if(
province &&
row.province !== province
){

return false;

}


if(
district &&
row.district !== district
){

return false;

}


if(search){

let people =
parsePeople(
row.people
);

const found =
people.some(
person=>{

const name =
String(
person.name || ""
).toLowerCase();

const father =
String(
person.father_name || ""
).toLowerCase();

return(
name.includes(search) ||
father.includes(search)
);

});

if(!found){

return false;

}

}


return true;

});


renderStats(rows);

renderTable(rows);

}



/* ======================================
   STATS
====================================== */

function renderStats(rows){

let households =
rows.length;

let population =
0;

let male =
0;

let female =
0;


rows.forEach(
row=>{

population +=
Number(
row.members || 0
);

male +=
Number(
row.male || 0
);

female +=
Number(
row.female || 0
);

});


document.getElementById(
"totalHouseholds"
).textContent =
households.toLocaleString(
"en-US"
);

document.getElementById(
"totalPopulation"
).textContent =
population.toLocaleString(
"en-US"
);

document.getElementById(
"totalMale"
).textContent =
male.toLocaleString(
"en-US"
);

document.getElementById(
"totalFemale"
).textContent =
female.toLocaleString(
"en-US"
);

}



/* ======================================
   PARSE PEOPLE
====================================== */

function parsePeople(people){

if(!people){

return [];

}


if(typeof people === "string"){

try{

people =
JSON.parse(people);

}catch(e){

return [];

}

}


return Array.isArray(people)
? people
: [];

}



/* ======================================
   RENDER TABLE
====================================== */

function renderTable(rows){

const container =
document.getElementById(
"tableContainer"
);


if(rows.length === 0){

container.innerHTML =
'<div class="empty">د ټاکل شوو شرایطو مطابق معلومات ونه موندل شول.</div>';

return;

}


let html = `

<table>

<thead>

<tr>

<th>نېټه</th>

<th>ولایت</th>

<th>ولسوالي</th>

<th>سیمه / کلی</th>

<th>غړي</th>

<th>نارینه</th>

<th>ښځینه</th>

<th>د غړو معلومات</th>

<th>عملیات</th>

</tr>

</thead>

<tbody>

`;


rows.forEach(
row=>{

let people =
parsePeople(
row.people
);

let membersHtml =
"";


people.forEach(
(person,index)=>{

const relation =
person.relation ||
person.relationship ||
"-";

const work =
person.work_status ||
person.employment ||
"-";


membersHtml += `

<div class="member">

<b>شخص ${index+1}</b><br>

نوم:
${escapeHtml(person.name || "-")}
<br>

د پلار نوم:
${escapeHtml(person.father_name || "-")}
<br>

جنس:
${escapeHtml(person.gender || "-")}
<br>

عمر:
${escapeHtml(person.age ?? "-")}
<br>

مدني حالت:
${escapeHtml(person.marital_status || "-")}
<br>

د کورنۍ اړیکه:
${escapeHtml(relation)}
<br>

زده کړې:
${escapeHtml(person.education || "-")}
<br>

د کار حالت:
${escapeHtml(work)}
<br>

دنده:
${escapeHtml(person.occupation || "-")}

</div>

`;

});


const date =
row.created_at
?
new Date(
row.created_at
).toLocaleString(
"ps-AF"
)
:
"-";


html += `

<tr>

<td>
${escapeHtml(date)}
</td>

<td>
${escapeHtml(row.province || "-")}
</td>

<td>
${escapeHtml(row.district || "-")}
</td>

<td>
${escapeHtml(row.village || "-")}
</td>

<td>
${escapeHtml(row.members || 0)}
</td>

<td>
${escapeHtml(row.male || 0)}
</td>

<td>
${escapeHtml(row.female || 0)}
</td>

<td>
${membersHtml || "-"}
</td>

<td>

<button
class="edit-btn"
onclick="openEdit(${Number(row.id)})"
type="button"
>
✏️ Edit
</button>

<button
class="delete-btn"
onclick="deleteFamily(${Number(row.id)})"
type="button"
>
🗑️ Delete
</button>

</td>

</tr>

`;

});


html += `

</tbody>

</table>

`;

container.innerHTML =
html;

}



/* ======================================
   OPEN EDIT
====================================== */

const row =
allRows.find(
item =>
Number(item.id) === Number(id)
);


if(!row){

alert(
"معلومات ونه موندل شول."
);

return;

}


editingId =
id;


let people =
parsePeople(
row.people
);


let peopleHtml =
"";


people.forEach(
(person,index)=>{

const relation =
person.relation ||
person.relationship ||
"";

const work =
person.work_status ||
person.employment ||
"";


peopleHtml += `

<div class="edit-person">

<h3>
👤 د کورنۍ غړی ${index+1}
</h3>

<div class="edit-family-grid">

<div>

<label>
نوم
</label>
