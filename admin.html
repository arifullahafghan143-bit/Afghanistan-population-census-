<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - د نفوس سیستم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

.container{
width:100%;
max-width:1250px;
margin:auto;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
margin:60px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,.12);
}

h1{
text-align:center;
margin-top:0;
font-size:25px;
}

.subtitle{
text-align:center;
color:#64748b;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:7px;
font-weight:bold;
}

input{
width:100%;
padding:13px;
border:1px solid #cbd5e1;
border-radius:10px;
font-size:16px;
margin-bottom:16px;
direction:ltr;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.logout{background:#dc2626}
.logout:hover{background:#b91c1c}

.refresh{background:#16a34a}
.refresh:hover{background:#15803d}

.message{
margin-top:15px;
padding:12px;
border-radius:10px;
text-align:center;
display:none;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.success{
background:#dcfce7;
color:#166534;
}

.admin-header{
background:white;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.header-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.header-row h1{margin:0}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
text-align:center;
}

.card-title{
color:#64748b;
font-size:15px;
margin-bottom:8px;
}

.card-number{
font-size:30px;
font-weight:bold;
color:#2563eb;
}

.table-box{
background:white;
border-radius:16px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:1000px;
}

th,td{
padding:12px;
border-bottom:1px solid #e2e8f0;
text-align:right;
vertical-align:top;
}

th{
background:#f8fafc;
font-weight:bold;
}

.member{
background:#f8fafc;
border-radius:10px;
padding:10px;
margin-bottom:8px;
line-height:1.8;
border:1px solid #e2e8f0;
}

.member:last-child{margin-bottom:0}

.empty,.loading{
text-align:center;
padding:40px;
color:#64748b;
font-size:18px;
}

#adminPanel{display:none}

.small{
font-size:13px;
color:#64748b;
margin-top:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPanel" class="login-box">

<h1>🔐 د Admin سیستم</h1>

<div class="subtitle">
د افغانستان د نفوس آنلاین شمېرنه
</div>

<label for="email">Email</label>

<input
type="email"
id="email"
placeholder="admin@example.com"
autocomplete="email"
>

<label for="password">Password</label>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
>

<button onclick="login()">
ننوتل
</button>

<div id="message" class="message"></div>

<a
href="index.html"
style="display:block;text-align:center;margin-top:20px;color:#2563eb;text-decoration:none;"
>
← اصلي فورم ته ستنېدل
</a>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="container">

<div class="admin-header">

<div class="header-row">

<h1>📊 د نفوس Admin سیستم</h1>

<div class="actions">

<button
class="refresh"
onclick="loadData()"
>
🔄 معلومات تازه کول
</button>

<button
class="logout"
onclick="logout()"
>
🚪 وتل
</button>

</div>

</div>

<div class="small">
یوازې د مجاز Admin لپاره
</div>

</div>


<!-- STATS -->
<div class="stats">

<div class="card">
<div class="card-title">ټولې کورنۍ</div
