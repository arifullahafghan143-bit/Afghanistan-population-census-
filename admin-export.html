<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Export</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f1f5f9;
color:#172033;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:18px;
padding:25px;
margin-top:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.header{
background:linear-gradient(135deg,#075985,#0f766e);
color:white;
padding:25px;
border-radius:18px;
}

h1,h2,h3{
margin-top:0;
}

input,
select{
width:100%;
padding:13px;
margin:7px 0 15px;
border:1px solid #cbd5e1;
border-radius:9px;
font-size:15px;
}

button{
border:0;
border-radius:9px;
padding:12px 18px;
font-family:inherit;
font-size:15px;
cursor:pointer;
margin:5px;
}

.primary{
background:#0f766e;
color:white;
}

.excel{
background:#166534;
color:white;
}

.csv{
background:#2563eb;
color:white;
}

.logout{
background:#dc2626;
color:white;
}

.hidden{
display:none!important;
}

.message{
margin-top:15px;
font-weight:bold;
}

.error{
color:#b91c1c;
}

.success{
color:#15803d;
}

.filters{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.info{
background:#f0fdfa;
border:1px solid #99f6e4;
padding:15px;
border-radius:10px;
margin-top:15px;
line-height:2;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.stat{
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:12px;
padding:20px;
text-align:center;
}

.stat strong{
display:block;
font-size:28px;
margin-top:8px;
color:#075985;
}

.household{
border:1px solid #cbd5e1;
border-radius:15px;
margin-top:18px;
overflow:hidden;
background:#fff;
}

.householdHeader{
background:#f0fdfa;
padding:15px;
border-bottom:1px solid #cbd5e1;
font-weight:bold;
line-height:1.9;
}

.people{
padding:10px;
overflow-x:auto;
}

.people table{
width:100%;
border-collapse:collapse;
min-width:900px;
}

.people th,
.people td{
border:1px solid #e2e8f0;
padding:9px;
text-align:right;
}

.people th{
background:#f8fafc;
}

.empty{
text-align:center;
padding:30px;
color:#64748b;
}

@media(max-width:600px){

.container{
padding:10px;
}

.card{
padding:15px;
}

.filters{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">


<!-- ================= LOGIN ================= -->

<div id="loginBox" class="card">

<div class="header">

<h1>
🔐 د معلوماتو Export
</h1>

<p>
یوازې د Admin لپاره
</p>

</div>

<label>
ایمیل
</label>

<input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="off">

<label>
پاسورډ
</label>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="off">

<button
class="primary"
onclick="login()">

Login

</button>

<div
id="loginMessage"
class="message">
</div>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div
id="exportPanel"
class="hidden">


<div class="header">

<h1>
📊 د افغانستان د نفوس معلومات
</h1>

<p>
د کورنیو او ټولو غړو معلومات
</p>

<button
class="logout"
onclick="logout()">

🚪 وتل

</button>

</div>


<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">

د کورنیو شمېر

<strong id="count">
0
</strong>

</div>

<div class="stat">

ټول نفوس

<strong id="population">
0
</strong>

</div>

</div>


<!-- ================= FILTER ================= -->

<div class="card">

<h2>
🔎 د معلوماتو لټون
</h2>

<div class="filters">

<div>

<label>
ولایت
</label>

<select
id="province"
onchange="provinceChanged()">

<option value="">
ټول ولایتونه
</option>

</select>

</div>


<div>

<label>
ولسوالي
</label>

<select
id="district"
onchange="filterData()">

<option value="">
ټولې ولسوالۍ
</option>

</select>

</div>

</div>


<label>
د شخص نوم یا د پلار نوم
</label>

<input
id="search"
placeholder="نوم یا د پلار نوم..."
oninput="filterData()">

</div>


<!-- ================= EXPORT ================= -->

<div class="card">

<h2>
📥 Export
</h2>

<button
class="excel"
onclick="exportExcel()">

📊 Excel (.xlsx)

</button>

<button
class="csv"
onclick="exportCSV()">

📄 CSV

</button>

<div
id="message"
class="message">
</div>

</div>


<!-- ================= HOUSEHOLDS ================= -->

<div class="card">

<h2>
🏠 کورنۍ او د کورنۍ غړي
</h2>

<div id="households">

<div class="empty">
معلومات لوستل کېږي...
</div>

</div>

</div>


</div>

</div>


<script>


/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
"https://lswxkfkqpkzncbpiqqyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable__YQz3wIbmc7qXYxJvL9fcw_CpmHhDxT";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =================================================
   DATA
================================================= */

let rows = [];

let filtered = [];


/* =================================================
   LOGIN
================================================= */

async function login(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const message =
document
.getElementById("loginMessage");


if(!email || !password){

message.className =
"message error";

message.textContent =
"ایمیل او پاسورډ ولیکئ.";

return;

}


message.className =
"message";

message.textContent =
"Login کېږي...";


const result =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

message.className =
"message error";

message.textContent =
"Login ناکام شو: " +
result.error.message;

return;

}


/*
د Login وروسته تازه Session اخلو.
*/

await new Promise(
resolve =>
setTimeout(resolve,500)
);


const sessionResult =
await db.auth.getSession();


if(
!sessionResult.data ||
!sessionResult.data.session
){

message.className =
"message error";

message.textContent =
"Session جوړ نه شو. بیا Login وکړئ.";

return;

}


/*
Login کامیاب شو.
*/

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("exportPanel")
.classList.remove("hidden");


await loadData();

}


/* =================================================
   LOAD ALL HOUSEHOLDS
================================================= */

async function loadData(){

const box =
document.getElementById(
"households"
);

box.innerHTML =
`
<div class="empty">
⏳ معلومات لوستل کېږي...
</div>
`;


const result =
await db.rpc(
"admin_get_households"
);


if(result.error){

box.innerHTML =
`
<div class="empty">
❌ معلومات ونه لوستل شول.<br>
${escapeHTML(result.error.message)}
</div>
`;

showMessage(
"معلومات ونه لوستل شول.",
true
);

return;

}


/*
RPC JSON واپس راکوي.
*/

let data = result.data;


if(typeof data === "string"){

try{

data =
JSON.parse(data);

}catch(e){

data = [];

}

}


rows =
Array.isArray(data)
? data
: [];


filtered =
[...rows];


fillProvinces();

renderInfo();

renderHouseholds();


if(rows.length === 0){

showMessage(
"اوس مهال هېڅ کورنۍ معلومات نه شته.",
true
);

}else{

showMessage(
rows.length +
" کورنۍ معلومات ترلاسه شول."
);

}

}


/* =================================================
   PROVINCES
================================================= */

function fillProvinces(){

const select =
document.getElementById(
"province"
);

const provinces =
[
...new Set(
rows
.map(x => x.province)
.filter(Boolean)
)
].sort();


select.innerHTML =
`
<option value="">
ټول ولایتونه
</option>
`;


provinces.forEach(
province => {

const option =
document.createElement(
"option"
);

option.value =
province;

option.textContent =
province;

select.appendChild(
option
);

});


fillDistricts();

}


/* =================================================
   DISTRICTS
================================================= */

function provinceChanged(){

fillDistricts();

filterData();

}


function fillDistricts(){

const province =
document
.getElementById("province")
.value;

let data =
rows;


if(province){

data =
rows.filter(
x =>
x.province === province
);

}


const districts =
[
...new Set(
data
.map(x => x.district)
.filter(Boolean)
)
].sort();


const select =
document.getElementById(
"district"
);


select.innerHTML =
`
<option value="">
ټولې ولسوالۍ
</option>
`;


districts.forEach(
district => {

const option =
document.createElement(
"option"
);

option.value =
district;

option.textContent =
district;

select.appendChild(
option
);

});

}


/* =================================================
   FILTER
================================================= */

function filterData(){

const search =
document
.getElementById("search")
.value
.trim()
.toLowerCase();

const province =
document
.getElementById("province")
.value;

const district =
document
.getElementById("district")
.value;


filtered =
rows.filter(row => {


if(
province &&
row.province !== province
){

return false;

}


if(
district &&
row.district !== district
){

return false;

}


if(search){

const people =
Array.isArray(row.people)
? row.people
: [];


const found =
people.some(person => {

const name =
String(
person.name || ""
)
.toLowerCase();

const father =
String(
person.father_name || ""
)
.toLowerCase();


return(
name.includes(search) ||
father.includes(search)
);

});


if(!found){

return false;

}

}


return true;

});


renderInfo();

renderHouseholds();

}


/* =================================================
   STATS
================================================= */

function renderInfo(){

let population = 0;


filtered.forEach(row => {

population +=
Number(
row.members || 0
);

});


document
.getElementById("count")
.textContent =
filtered.length;


document
.getElementById("population")
.textContent =
population;

}


/* =================================================
   SHOW HOUSEHOLDS
================================================= */

function renderHouseholds(){

const box =
document.getElementById(
"households"
);


if(!filtered.length){

box.innerHTML =
`
<div class="empty">
🏠 هېڅ کورنۍ ونه موندل شوه.
</div>
`;

return;

}


let html = "";


filtered.forEach(
(row,index) => {


const people =
Array.isArray(row.people)
? row.people
: [];


html +=
`
<div class="household">

<div class="householdHeader">

🏠 کورنۍ #${index + 1}

<br>

ID:
${escapeHTML(row.id)}

<br>

📍 ولایت:
${escapeHTML(row.province || "")}

&nbsp;&nbsp;

📍 ولسوالۍ:
${escapeHTML(row.district || "")}

<br>

🏘️ سیمه/کلی:
${escapeHTML(row.village || "")}

<br>

👨‍👩‍👧‍👦 د کورنۍ غړي:
${escapeHTML(row.members || 0)}

&nbsp;&nbsp;

👨 نارینه:
${escapeHTML(row.male || 0)}

&nbsp;&nbsp;

👩 ښځینه:
${escapeHTML(row.female || 0)}

</div>

<div class="people">

<table>

<thead>

<tr>

<th>#</th>

<th>نوم</th>

<th>د پلار نوم</th>

<th>جنس</th>

<th>عمر</th>

<th>مدني حالت</th>

<th>اړیکه</th>

<th>زده کړه</th>

<th>د کار حالت</th>

<th>مسلک</th>

</tr>

</thead>

<tbody>
`;


people.forEach(
(person,personIndex) => {

html +=
`
<tr>

<td>
${personIndex + 1}
</td>

<td>
${escapeHTML(
person.name || ""
)}
</td>

<td>
${escapeHTML(
person.father_name || ""
)}
</td>

<td>
${escapeHTML(
person.gender || ""
)}
</td>

<td>
${escapeHTML(
person.age || ""
)}
</td>

<td>
${escapeHTML(
person.marital_status || ""
)}
</td>

<td>
${escapeHTML(
person.relation || ""
)}
</td>

<td>
${escapeHTML(
person.education || ""
)}
</td>

<td>
${escapeHTML(
person.work_status || ""
)}
</td>

<td>
${escapeHTML(
person.occupation || ""
)}
</td>

</tr>
`;

});


html +=
`
</tbody>

</table>

</div>

</div>
`;

});


box.innerHTML =
html;

}


/* =================================================
   BUILD EXPORT DATA
================================================= */

function buildExportData(){

const data = [];


filtered.forEach(row => {

const people =
Array.isArray(row.people)
? row.people
: [];


people.forEach(person => {

data.push({

"Household ID":
row.id,

"Province":
row.province || "",

"District":
row.district || "",

"Village":
row.village || "",

"Household Members":
row.members || 0,

"Male":
row.male || 0,

"Female":
row.female || 0,

"Name":
person.name || "",

"Father Name":
person.father_name || "",

"Gender":
person.gender || "",

"Age":
person.age || "",

"Marital Status":
person.marital_status || "",

"Relation":
person.relation || "",

"Education":
person.education || "",

"Work Status":
person.work_status || "",

"Occupation":
person.occupation || "",

"Created At":
row.created_at || ""

});

});

});


return data;

}


/* =================================================
   EXCEL
================================================= */

function exportExcel(){

const data =
buildExportData();


if(!data.length){

showMessage(
"د Export لپاره معلومات نشته.",
true
);

return;

}


const worksheet =
XLSX.utils.json_to_sheet(
data
);


const workbook =
XLSX.utils.book_new();


XLSX.utils.book_append_sheet(
workbook,
worksheet,
"Population"
);


XLSX.writeFile(
workbook,
"Afghanistan-Population.xlsx"
);


showMessage(
"Excel فایل جوړ شو."
);

}


/* =================================================
   CSV
================================================= */

function exportCSV(){

const data =
buildExportData();


if(!data.length){

showMessage(
"د Export لپاره معلومات نشته.",
true
);

return;

}


const worksheet =
XLSX.utils.json_to_sheet(
data
);


const csv =
XLSX.utils.sheet_to_csv(
worksheet
);


const blob =
new Blob(
[
"\ufeff" + csv
],
{
type:
"text/csv;charset=utf-8;"
}
);


const url =
URL.createObjectURL(
blob
);


const link =
document.createElement(
"a"
);


link.href =
url;

link.download =
"Afghanistan-Population.csv";


document.body.appendChild(
link
);

link.click();

document.body.removeChild(
link
);


URL.revokeObjectURL(
url
);


showMessage(
"CSV فایل جوړ شو."
);

}


/* =================================================
   LOGOUT
================================================= */

async function logout(){

await db.auth.signOut();


rows = [];

filtered = [];


document
.getElementById("exportPanel")
.classList.add("hidden");


document
.getElementById("loginBox")
.classList.remove("hidden");


document
.getElementById("email")
.value =
"";


document
.getElementById("password")
.value =
"";


document
.getElementById("loginMessage")
.textContent =
"";


document
.getElementById("households")
.innerHTML =
"";

}


/* =================================================
   MESSAGE
================================================= */

function showMessage(
text,
error = false
){

const box =
document.getElementById(
"message"
);


box.className =
error
? "message error"
: "message success";


box.textContent =
text;

}


/* =================================================
   ESCAPE HTML
================================================= */

function escapeHTML(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =================================================
   FORCE LOGIN EVERY TIME
================================================= */

async function checkSession(){

/*
هر ځل پخوانی Session ختموو،
ترڅو Admin Export Login وغواړي.
*/

await db.auth.signOut();


document
.getElementById("loginBox")
.classList.remove("hidden");


document
.getElementById("exportPanel")
.classList.add("hidden");

}


/* =================================================
   START
================================================= */

checkSession();

</script>

</body>

</html>
